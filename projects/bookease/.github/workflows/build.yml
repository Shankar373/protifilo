name: BookEase Build
on:
  push:
    paths:
      - 'projects/bookease/**'
  pull_request:
    paths:
      - 'projects/bookease/**'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/bookease/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test package
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/bookease/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/bookease/frontend/package.json
      - run: npm install
      - run: npm run build
